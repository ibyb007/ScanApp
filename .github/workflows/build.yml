name: Build APK

# Manual only: Actions tab > "Build APK" > Run workflow
#
#   stable : normal GitHub *Release*     tag v<version>            e.g. v1.3.5          shown as "1.3.5"
#   canary : GitHub *Pre-release*        tag v<stable>-canary.<n>  e.g. v1.3.5-canary.1 shown as "1.3.5 (1)"
#
# For a STABLE run, type the version number in the "version" box (e.g. 1.3.5, no leading v).
# Canary numbers count up from 1 after every stable release: stable 1.3.5 is followed by
# 1.3.5 (1), 1.3.5 (2), ... until the next stable restarts the count. The in-app updater
# (Settings > Update channel) reads these releases: Stable only offers stable releases,
# Canary offers both.

on:
  workflow_dispatch:   # the only way to trigger a build — no push/PR auto-runs
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [ canary, stable ]
        default: canary
      version:
        description: "Stable only: version number, e.g. 1.3.5 (no leading v). Must be higher than the last stable."
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # required so the release step can create tags/releases

env:
  BASE_VERSION: "1.0.0"   # canary base before the first stable release exists

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed for version numbering and the changelog

      # ---------- Work out channel / version ----------
      - name: Resolve channel and version
        id: meta
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet || true

          # newest stable release (tags like v1.3.5); canaries after it are numbered from it
          LAST_STABLE="$( { git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's/^v//' | sort -V | tail -n1 )"
          # highest version any tag was made for (stable or canary base)
          HIGHEST="$( { git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$' || true; } \
                      | sed -E 's/^v//; s/-canary\.[0-9]+$//' | sort -V | tail -n1 )"

          if [[ "$INPUT_CHANNEL" == "stable" ]]; then
            CHANNEL="stable"
            VERSION="${INPUT_VERSION#v}"
            if [[ -z "$VERSION" ]]; then echo "::error::Stable runs need a 'version' input, e.g. 1.3.5"; exit 1; fi
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.3.5"; exit 1; fi
            if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then echo "::error::Tag v${VERSION} already exists"; exit 1; fi
            # must be higher than every earlier stable AND than the base of earlier canaries, otherwise
            # devices on a canary of that version would never be offered it
            if [[ -n "$HIGHEST" && ( "$VERSION" == "$HIGHEST" || "$(printf '%s\n%s\n' "$VERSION" "$HIGHEST" | sort -V | tail -n1)" != "$VERSION" ) ]]; then
              echo "::error::Stable version $VERSION must be higher than $HIGHEST"; exit 1
            fi
            VERSION_NAME="$VERSION"
            TAG="v${VERSION}"
            TITLE="ScanApp v${VERSION}"
            PRERELEASE=false
          else
            CHANNEL="canary"
            BASE="${LAST_STABLE:-$BASE_VERSION}"
            LAST_N="$( { git tag -l "v${BASE}-canary.*" || true; } | sed -E 's/.*-canary\.//' | sort -n | tail -n1 )"
            N=$(( ${LAST_N:-0} + 1 ))
            VERSION_NAME="${BASE}-canary.${N}"
            TAG="v${VERSION_NAME}"
            TITLE="ScanApp Canary ${BASE} (${N})"
            PRERELEASE=true
          fi

          {
            echo "channel=$CHANNEL"
            echo "version_name=$VERSION_NAME"
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "prerelease=$PRERELEASE"
            echo "apk_name=ScanApp-${VERSION_NAME}.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Channel=$CHANNEL  Version=$VERSION_NAME  Tag=$TAG  Title=$TITLE"

      # ---------- Release notes: the 4 newest changes since the previous release ----------
      - name: Generate release notes
        shell: bash
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          # stable: changes since the previous stable release; canary: since the previous release of any kind
          if [[ "$CHANNEL" == "stable" ]]; then
            PREV="$( { git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n1 )"
          else
            PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          fi
          if [[ -n "$PREV" ]]; then RANGE="${PREV}..HEAD"; else RANGE="HEAD"; fi

          git log "$RANGE" --no-merges --pretty='%s' -n 100 \
            | sed -E 's/^[A-Za-z]+(\([^)]*\))?!?:[[:space:]]*//' \
            | grep -v -i -E '^(merge |wip|update readme|bump |release )' \
            | awk 'NF && !seen[tolower($0)]++' \
            | head -n 4 \
            | sed -E 's/^(.)/\U\1/; s/^/- /' > changes.md || true

          if [[ ! -s changes.md ]]; then echo "- Maintenance and stability improvements" > changes.md; fi

          {
            if [[ "$CHANNEL" == "canary" ]]; then
              echo "> [!IMPORTANT]"
              echo "> **Canary builds are for testing and may contain bugs or regressions.** If you prefer a reliable experience, stay on the **Stable** channel."
              echo
            fi
            echo "### What's changed"
            cat changes.md
          } > release-notes.md
          cat release-notes.md

      # ---------- Toolchain ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---------- Build ----------
      # versionName comes from the resolved tag, versionCode from the run number (always increasing).
      - name: Build debug APK
        run: >
          gradle assembleDebug --no-daemon
          -PbuildNumber=${{ github.run_number }}
          -PappVersionName="${{ steps.meta.outputs.version_name }}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Builds the RELEASE variant, signed with the real, permanent release key
      # (see the signingConfigs comment in app/build.gradle.kts for why — every
      # Actions run is a fresh machine, so the debug keystore can't be reused).
      # RELEASE_KEYSTORE_BASE64 holds the keystore file, base64-encoded; it is
      # decoded for this run only, then discarded with the throwaway VM.
      - name: Decode release keystore
        run: printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        run: >
          gradle assembleRelease --no-daemon
          -PbuildNumber=${{ github.run_number }}
          -PappVersionName="${{ steps.meta.outputs.version_name }}"
          -PRELEASE_STORE_FILE=${{ github.workspace }}/release.keystore
          -PRELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          -PRELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          -PRELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Clean up decoded keystore
        if: always()
        run: rm -f release.keystore

      - name: Collect APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "::error::No release APK found"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/${{ steps.meta.outputs.apk_name }}"
          (cd dist && sha256sum "${{ steps.meta.outputs.apk_name }}" > "${{ steps.meta.outputs.apk_name }}.sha256")
          ls -la dist

      # ---------- Release ----------
      # A real GitHub Release (stable) or Pre-release (canary) with the APK attached - not just a tag.
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
        run: |
          set -euo pipefail
          args=( "$TAG" "dist/${APK_NAME}" "dist/${APK_NAME}.sha256"
                 --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.md )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=( --prerelease --latest=false )
          else
            args+=( --latest )
          fi
          gh release create "${args[@]}"

      # Keep only the 10 newest canary pre-releases so the Releases page stays tidy.
      - name: Prune old canary releases
        if: steps.meta.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-canary\\."))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting old canary $tag"
              gh release delete "$tag" --cleanup-tag --yes || true
            done
